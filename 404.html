  <style>
    *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--green-deep);
      color: var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      font-family: var(--font-body, 'Inter', sans-serif);
    }

    .error-wrap {
      position: relative;
      z-index: 1;
      padding: clamp(2rem, 6vw, 5rem) clamp(1.5rem, 5vw, 4rem);
      max-width: 680px;
      width: 100%;
    }

    .error-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 2rem;
    }

    .error-num {
      font-family: var(--font-display, 'Cormorant Garamond', serif);
      font-size: clamp(7rem, 22vw, 16rem);
      font-weight: 700;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 2px var(--gold, #D4A843);
      letter-spacing: -.02em;
      margin-bottom: 1rem;
    }

    .error-title {
      font-family: var(--font-display, 'Cormorant Garamond', serif);
      font-size: clamp(1.4rem, 4vw, 2.2rem);
      font-weight: 600;
      color: var(--cream, #FAF7F0);
      margin-bottom: 1rem;
    }

    .error-desc {
      font-size: clamp(.9rem, 2vw, 1.05rem);
      color: rgba(250, 247, 240, .6);
      max-width: 420px;
      margin: 0 auto 2.5rem;
      line-height: 1.7;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: var(--gold, #D4A843);
      color: var(--green-deep, #1A2E1A);
      text-decoration: none;
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: .9rem 2.2rem;
      border-radius: 4px;
      transition: transform .2s, box-shadow .2s;
    }
    .error-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(212,168,67,.35);
    }

    .error-divider {
      width: 48px;
      height: 2px;
      background: var(--gold, #D4A843);
      margin: 0 auto 2rem;
    }

    /* Hide for animation only when JS is ready and motion is allowed */
    html.js-ready .error-logo,
    html.js-ready .error-num,
    html.js-ready .error-title,
    html.js-ready .error-desc,
    html.js-ready .error-btn,
    html.js-ready .error-divider { opacity: 0; }

    /* Decorative floating particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(212,168,67,.08);
      animation: float linear infinite;
    }
    @keyframes float {
      0% { transform: translateY(110vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle { animation: none; opacity: 0; }
      .error-logo, .error-num, .error-divider, .error-title, .error-desc, .error-btn { opacity: 1 !important; }
    }
  </style>

<main class="error-wrap" role="main">
  <picture><source srcset="./assets/images/logo.webp" type="image/webp"><img
    src="./assets/images/logo.png"
    alt="Farmacia Fernández Díez"
    class="error-logo"
    width="72" height="72"
    id="error-logo"
  ></picture>

  <p class="error-num" id="error-num" aria-label="Error 404">404</p>

  <div class="error-divider" id="error-divider"></div>

  <h1 class="error-title" id="error-title">Página no encontrada</h1>

  <p class="error-desc" id="error-desc">
    Esta página no existe o ha sido movida.<br>
    Vuelve al inicio de Farmacia Fernández Díez.
  </p>

  <a href="./es/index.html" class="error-btn" id="error-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    Volver al inicio
  </a>
</main>

<script>
  // Language-aware home link
  (function () {
    const map = {
      es: './es/index.html',
      eu: './eu/index.html',
      en: './en/index.html',
      fr: './fr/index.html'
    };
    const titles = {
      es: { title: 'Página no encontrada', desc: 'Esta página no existe o ha sido movida.<br>Vuelve al inicio de Farmacia Fernández Díez.', btn: 'Volver al inicio' },
      eu: { title: 'Orria ez da aurkitu', desc: 'Orri hau ez da existitzen edo lekuz aldatu da.<br>Itzuli Farmacia Fernández Díez-en hasierara.', btn: 'Hasierara itzuli' },
      en: { title: 'Page not found', desc: 'This page does not exist or has been moved.<br>Return to the Farmacia Fernández Díez home page.', btn: 'Back to home' },
      fr: { title: 'Page non trouvée', desc: 'Cette page n\u2019existe pas ou a \u00e9t\u00e9 d\u00e9plac\u00e9e.<br>Revenez \u00e0 l\u2019accueil de la Pharmacie Fern\u00e1ndez D\u00edez.', btn: 'Retour \u00e0 l\u2019accueil' }
    };
    const path = location.pathname.toLowerCase();
    let lang = null;
    const m = path.match(/\/(es|eu|en|fr)(\/|$)/);
    if (m) lang = m[1];
    if (!lang) {
      const nav = (navigator.language || 'es').slice(0, 2).toLowerCase();
      lang = map[nav] ? nav : 'es';
    }
    const btn = document.getElementById('error-btn');
    const title = document.getElementById('error-title');
    const desc = document.getElementById('error-desc');
    if (btn) btn.setAttribute('href', map[lang]);
    if (title) title.textContent = titles[lang].title;
    if (desc) desc.innerHTML = titles[lang].desc;
    if (btn) {
      const svg = btn.querySelector('svg');
      btn.innerHTML = '';
      if (svg) btn.appendChild(svg);
      btn.appendChild(document.createTextNode(' ' + titles[lang].btn));
    }
    document.documentElement.setAttribute('lang', lang);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarsePointer = window.matchMedia('(pointer: coarse)').matches;

  if (!reduceMotion) {
    const tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    tl
      .fromTo('#error-logo',   { y: -40, autoAlpha: 0 }, { y: 0,  autoAlpha: 1, duration: .9, ease: 'back.out(1.8)' }, 0)
      .fromTo('#error-num',    { autoAlpha: 0, y: 30 },  { autoAlpha: 1, y: 0, duration: .8 }, 0.3)
      .fromTo('#error-divider',{ autoAlpha: 0, scaleX: 0 }, { autoAlpha: 1, scaleX: 1, duration: .6, transformOrigin: 'center' }, 0.7)
      .fromTo('#error-title',  { autoAlpha: 0, y: 20 },  { autoAlpha: 1, y: 0, duration: .6 }, 0.85)
      .fromTo('#error-desc',   { autoAlpha: 0, y: 15 },  { autoAlpha: 1, y: 0, duration: .6 }, 1.0)
      .fromTo('#error-btn',    { autoAlpha: 0, y: 10, scale: .95 }, { autoAlpha: 1, y: 0, scale: 1, duration: .5, ease: 'back.out(1.4)' }, 1.2);

    gsap.to('#error-logo', { y: -6, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 2 });
  }
</script>
